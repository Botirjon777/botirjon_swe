<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinning gradient border (pure CSS)</title>
<style>
@property --a {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
.btn {
  border: 3px solid transparent;
  border-radius: 999px;
  background:
    linear-gradient(#0B0F1A, #0B0F1A) padding-box,
    conic-gradient(from var(--a), #22D3EE, #A855F7, #22D3EE) border-box;
  animation: spin 2s linear infinite;
}
@keyframes spin { to { --a: 360deg; } }

/* page + button basics (not part of the trick) */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0F1A; }
.btn { padding: 24px 64px; color: #fff; font: 700 32px/1 Inter, system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <button class="btn">Hover me</button>
</body>
</html>
